<style>

}

* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  margin: 0;

.top a { text-decoration: none; transition: color .25s var(--ease); }
.top a:hover { color: var(--ink); }

main {

  padding: 18vh 0 6rem;
}

.eyebrow {
  margin: 0 0 .8rem;
  font-family: var(--sans);

  font-size: .72rem;

}

  letter-spacing: .04em;
  line-height: .95;
}

.lede {
  margin: 0 0 3rem;
  max-width: 24rem;
  font-weight: 300;
  font-size: 1.2rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-faint); }
.list a {
  display: grid;
  grid-template-columns: 3.2rem 1fr auto;
  gap: 1rem;
  align-items: baseline;
  padding: 1.35rem 0;
  border-bottom: 1px solid var(--ink-faint);
  text-decoration: none;
  transition: color .25s var(--ease);
}
.list a:hover { color: var(--gold); }
.list .n {

  letter-spacing: .01em;

.list .s {

  margin-top: .25rem;
  font-size: .98rem;
  font-weight: 300;
  color: var(--ink-mute);
  font-style: italic;
}
.list .go {
  font-family: var(--sans);
  font-weight: 300;
  font-size: .72rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
